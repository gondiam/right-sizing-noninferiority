[project]
name = "right-sizing-noninferiority"
version = "0.1.0"
description = "Choosing the cheaper model as a non-inferiority trial: pre-registered margins on MedQA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["llm-judge-stats", "numpy>=1.24"]

[tool.uv.sources]
llm-judge-stats = { git = "https://github.com/gondiam/llm-judge-stats", rev = "0100dc8" }

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
